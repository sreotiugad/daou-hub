name: Daily Daou Hub data

# 매일 오전 9시(KST) = 00:00 UTC 에 시트 RAW → data.json 갱신 후 커밋.
# 수동 실행도 가능(Actions 탭 → Run workflow).
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "수집 모드: real=광고API 수집 / sample=빅쿼리 연결 테스트용 더미"
        type: choice
        default: real
        options: [real, sample]
      backfill:
        description: "며칠치 수집(백필). 최초 1년치는 400."
        default: "1"

permissions:
  contents: write

concurrency:
  group: daou-hub-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ── 광고 RAW 자동 수집(네이버/구글 광고 API) ──
      #   accounts.json 대신 이 시크릿(JSON)로 계정·마크업·서비스 매핑을 준다.
      DAOU_AD_ACCOUNTS: ${{ secrets.DAOU_AD_ACCOUNTS }}
      #   구글애즈 공통 OAuth(계정별 customer_id 는 DAOU_AD_ACCOUNTS 안에)
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      # ── BigQuery RAW 창고 (BQ_DATASET 있으면 사용, 없으면 raw/ 폴더) ──
      BQ_DATASET: ${{ secrets.BQ_DATASET }}
      BQ_ADS_TABLE: ${{ secrets.BQ_ADS_TABLE }}
      BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
      # ── (선택) 구글시트 RAW: BQ·raw/ 둘 다 비었을 때만 사용 ──
      DAOU_SHEET_ID: ${{ secrets.DAOU_SHEET_ID }}
      DAOU_SHEET_WORKSHEET: ${{ secrets.DAOU_SHEET_WORKSHEET }}
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
      # ── 선택: 네이버 키워드 실검색량 ──
      NAVER1_CUSTOMER_ID: ${{ secrets.NAVER1_CUSTOMER_ID }}
      NAVER1_API_KEY: ${{ secrets.NAVER1_API_KEY }}
      NAVER1_SECRET_KEY: ${{ secrets.NAVER1_SECRET_KEY }}
      # DataLab + 검색 API (성별·연령·추이·콘텐츠수)
      NAVER_DEV_CLIENT_ID: ${{ secrets.NAVER_DEV_CLIENT_ID }}
      NAVER_DEV_CLIENT_SECRET: ${{ secrets.NAVER_DEV_CLIENT_SECRET }}
      # YouTube Data API v3 (영상 순위·썸네일)
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DAOU_KEYWORDS: ${{ secrets.DAOU_KEYWORDS }}
      DAOU_OUR_BRAND: ${{ secrets.DAOU_OUR_BRAND }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Ingest ads → RAW (광고 API 수집 → BigQuery/raw)
        env:
          MODE: ${{ github.event.inputs.mode || 'real' }}
          BF: ${{ github.event.inputs.backfill || '1' }}
        run: |
          cd pipeline
          if [ "$MODE" = "sample" ]; then
            python ingest.py --sample --backfill "$BF"
          else
            python ingest.py --backfill "$BF"
          fi

      # 샘플(빅쿼리 연결 테스트) 모드에서는 실데이터 data.json 을 건드리지 않는다.
      - name: Build data.json (RAW 창고 → data.json)
        if: ${{ github.event.inputs.mode != 'sample' }}
        run: |
          cd pipeline
          python build_data.py

      - name: Commit data.json + raw if changed
        if: ${{ github.event.inputs.mode != 'sample' }}
        run: |
          git config user.name  "daou-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json raw 2>/dev/null || git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh Daou Hub data.json [skip ci]"
            git push
          else
            echo "no changes"
          fi
