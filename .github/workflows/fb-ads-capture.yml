name: FB Ads Capture (validate)

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "검색어(경쟁사명)"
        default: "브이티"
  push:
    branches: [main]
    paths:
      - "pipeline/fb_ads_capture.py"
      - ".github/workflows/fb-ads-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright + Chromium + xvfb
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Capture (headed via xvfb)
        env:
          CAPTURE_KW: ${{ github.event.inputs.keyword || '브이티' }}
          CAPTURE_HEADED: "1"
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" python pipeline/fb_ads_capture.py
      - name: Commit captured ads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comp-ads
          git commit -m "chore: 경쟁사 광고 소재 캡처 [skip ci]" || echo "no change"
          git pull --rebase --autostash origin main || true
          git push || echo "push failed"
